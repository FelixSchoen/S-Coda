[project]
name = "scoda"
version = "3.0.0"
authors = [{ name = "Felix Schön", email = "schoen@kr.tuwien.ac.at" }]
description = "Deterministic symbolic-music processing for machine-learning workflows"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["midi", "music", "symbolic music", "machine learning", "tokenisation"]
license = "MIT"
license-files = ["LICENSE.md"]
dependencies = [
    "mido >= 1.3.3, < 2",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
"Homepage" = "https://github.com/FelixSchoen/S-Coda"
"Bugtracker" = "https://github.com/FelixSchoen/S-Coda/issues"
"Documentation" = "https://felixschoen.github.io/S-Coda/"

[project.optional-dependencies]
plot = ["matplotlib >= 3.8, < 4"]
test = ["pytest >= 9, < 10", "pytest-xdist >= 3.8, < 4", "pytest-cov >= 7, < 8",
        "coverage >= 7, < 8", "build >= 1.4, < 2", "ruff >= 0.15, < 1",
        "mypy >= 1.18, < 2", "hypothesis >= 6.130, < 7", "twine >= 6.2, < 7",
        "pip-audit >= 2.10, < 3"]
deploy = ["build >= 1.4, < 2", "twine >= 6.2, < 7"]
docs = ["mkdocs >= 1.6, < 2", "mkdocs-material >= 9.6, < 10",
        "mkdocstrings[python] >= 0.30, < 1"]

[build-system]
requires = ["setuptools == 80.10.1", "wheel == 0.46.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"scoda" = ["py.typed"]

[tool.setuptools.packages.find]
include = ["scoda", "scoda.*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["B007"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["scoda", "test/typecheck/public_api.py"]
warn_unreachable = true
no_site_packages = true

[[tool.mypy.overrides]]
module = ["mido", "mido.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true
