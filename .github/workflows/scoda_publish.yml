name: S-Coda Publish

on:
  release:
    types: [ published ]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .

      - name: Run release gates
        run: |
          ruff check scoda test benchmarks examples
          ruff format --check scoda test benchmarks examples
          python -m mypy
          python -m pytest test/ --cov=scoda --cov-report=term-missing --cov-fail-under=95
          python examples/quickstart.py
          python examples/midi_diagnostics.py
          python examples/tokenisation.py
          python -m mkdocs build --strict
          python -m pip_audit -r requirements.lock

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install release tooling
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"].removeprefix("v")
          if tag != version:
              raise SystemExit(f"release tag {tag!r} does not match project version {version!r}")
          PY

      - name: Build package
        run: python -m build

      - name: Check and test the exact wheel
        run: |
          python -m twine check dist/*
          python -m pip install --force-reinstall --no-deps dist/*.whl
          test_root="$(mktemp -d)"
          cp -R test "$test_root/test"
          cp -R examples "$test_root/examples"
          cp pyproject.toml "$test_root/pyproject.toml"
          cd "$test_root"
          python -m pytest test/

      - name: Test the exact sdist
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.tar.gz
          test_root="$(mktemp -d)"
          cp -R test "$test_root/test"
          cp -R examples "$test_root/examples"
          cp pyproject.toml "$test_root/pyproject.toml"
          cd "$test_root"
          python -m pytest test/

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
