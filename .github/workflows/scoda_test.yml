name: S-Coda Test

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: scoda-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .

      - name: Lint source, tests, benchmarks, and examples
        run: ruff check scoda test benchmarks examples

      - name: Type-check the public API
        run: python -m mypy

      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements.lock

      - name: Run source tests with coverage
        run: |
          python -m pytest test/ --cov=scoda --cov-report=term-missing --cov-fail-under=95

      - name: Run documentation examples
        run: |
          python examples/quickstart.py
          python examples/midi_diagnostics.py
          python examples/tokenisation.py

      - name: Build documentation strictly
        run: python -m mkdocs build --strict

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Run tests against installed wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          test_root="$(mktemp -d)"
          cp -R test "$test_root/test"
          cp -R examples "$test_root/examples"
          cp pyproject.toml "$test_root/pyproject.toml"
          cd "$test_root"
          python -m pytest test/

      - name: Run tests against installed sdist outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.tar.gz
          test_root="$(mktemp -d)"
          cp -R test "$test_root/test"
          cp -R examples "$test_root/examples"
          cp pyproject.toml "$test_root/pyproject.toml"
          cd "$test_root"
          python -m pytest test/
