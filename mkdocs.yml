site_name: S-Coda
site_description: Deterministic symbolic-music processing for machine-learning workflows
site_url: https://felixschoen.github.io/S-Coda/
repo_url: https://github.com/FelixSchoen/S-Coda
repo_name: FelixSchoen/S-Coda
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Overview: index.md
  - Quick start: quickstart.md
  - Musical values: concepts.md
  - MIDI: midi.md
  - Tokenisation: tokenisation.md
  - Reproducibility: reproducibility.md
  - API reference: api.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            heading_level: 2
            merge_init_into_class: true
            members_order: source
            separate_signature: true
            show_root_full_path: false
            show_source: false
            signature_crossrefs: true

watch:
  - scoda
